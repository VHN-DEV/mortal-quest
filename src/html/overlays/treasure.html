<!-- Tab: Quản Lý Pháp Bảo (Treasure Management) -->
<div id="screen-treasure"
    class="screen hidden absolute inset-0 z-[150] flex flex-col bg-qi-ink animate-fade-in">
    <header class="p-6 border-b border-white/5 flex justify-between items-center bg-black/40">
        <div class="flex items-center space-x-4">
            <button id="btn-close-treasure"
                class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/10 hover:bg-white/10 transition-all">
                <i class="ph ph-caret-left text-xl text-cultivation-gold"></i>
            </button>
            <div>
                <h2 class="text-2xl font-charm text-cultivation-gold">Linh Khí Các</h2>
                <p id="treasure-mgmt-subtitle"
                    class="text-[8px] text-gray-500 uppercase tracking-widest mt-1">Bồi dưỡng
                    bản mệnh pháp bảo</p>
            </div>
        </div>
    </header>

    <div class="flex-grow overflow-y-auto p-6 space-y-8 custom-scroll">
        <!-- Current Selected Artifact Info -->
        <div
            class="bg-white/5 rounded-3xl border border-white/10 p-6 flex flex-col items-center text-center space-y-4">
            <div id="treasure-mgmt-icon"
                class="text-6xl p-6 bg-black/40 rounded-full border border-cultivation-gold/20 shadow-[0_0_30px_rgba(212,175,55,0.1)]">
                ⚔️</div>
            <div>
                <h3 id="treasure-mgmt-name" class="text-2xl font-ancient text-white font-bold">
                    Thanh Hồng Kiếm</h3>
                <div id="treasure-mgmt-tier"
                    class="text-[10px] text-qi-blue uppercase tracking-[0.2em] mt-1">Linh Khí |
                    Cực Phẩm</div>
            </div>

            <div class="w-full grid grid-cols-2 gap-4 pt-4">
                <div class="space-y-1">
                    <div class="flex justify-between text-[9px] text-gray-500 uppercase">
                        <span>Độ bền</span> <span id="treasure-mgmt-durability-text">100%</span>
                    </div>
                    <div
                        class="h-1 bg-white/5 rounded-full overflow-hidden border border-white/5">
                        <div id="treasure-mgmt-durability-bar" class="h-full bg-green-500"
                            style="width: 100%"></div>
                    </div>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[9px] text-gray-500 uppercase">
                        <span>Linh tính</span> <span id="treasure-mgmt-spirit-text">0/500</span>
                    </div>
                    <div
                        class="h-1 bg-white/5 rounded-full overflow-hidden border border-white/5">
                        <div id="treasure-mgmt-spirit-bar" class="h-full bg-qi-blue"
                            style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Tabs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button id="btn-treasure-recognize"
                class="p-4 bg-red-900/20 border border-red-500/30 rounded-2xl flex flex-col items-center space-y-2 group hover:bg-red-900/30 transition-all">
                <i
                    class="ph ph-drop text-2xl text-red-500 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-ancient text-white uppercase tracking-widest">Nhận
                    Chủ</span>
            </button>
            <button id="btn-treasure-nourish"
                class="p-4 bg-qi-blue/10 border border-qi-blue/30 rounded-2xl flex flex-col items-center space-y-2 group hover:bg-qi-blue/20 transition-all">
                <i
                    class="ph ph-sparkle text-2xl text-qi-blue group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-ancient text-white uppercase tracking-widest">Nuôi
                    Dưỡng</span>
            </button>
            <button id="btn-treasure-repair"
                class="p-4 bg-orange-900/20 border border-orange-500/30 rounded-2xl flex flex-col items-center space-y-2 group hover:bg-orange-900/30 transition-all">
                <i
                    class="ph ph-wrench text-2xl text-orange-500 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-ancient text-white uppercase tracking-widest">Sửa
                    Chữa</span>
            </button>
            <button id="btn-treasure-refine"
                class="p-4 bg-qi-purple/10 border border-qi-purple/30 rounded-2xl flex flex-col items-center space-y-2 group hover:bg-qi-purple/20 transition-all">
                <i
                    class="ph ph-magic-wand text-2xl text-qi-purple group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-ancient text-white uppercase tracking-widest">Tẩy
                    Luyện</span>
            </button>
        </div>

        <!-- Details Section -->
        <div class="space-y-4">
            <h4
                class="text-xs font-ancient text-gray-500 uppercase tracking-widest border-l-2 border-gray-500 pl-3">
                Thông số hiện tại</h4>
            <div id="treasure-mgmt-stats"
                class="bg-black/40 rounded-2xl border border-white/5 p-4 grid grid-cols-2 gap-4 text-[10px]">
                <!-- Stats here -->
            </div>
        </div>
    </div>
</div>
