<!-- Loading Screen (Splash) -->
<div id="loading-screen" class="fixed inset-0 z-[10000]">
    <!-- Background Layers -->
    <div class="loading-bg-container">
        <div class="loading-bg-image"></div>
        <div class="loading-bg-overlay"></div>
        <div class="loading-mist"></div>
    </div>

    <!-- Spirit Particles -->
    <div class="spirit-particles" id="spirit-particles">
        <!-- Dynamically generated particles -->
    </div>

    <!-- Yin-Yang Centerpiece -->
    <div class="loading-centerpiece-container">
        <div class="yinyang-glow-ring"></div>
        <svg class="yinyang-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Ink Wash Gradient for the Yin path (faded/uneven brush ink) -->
                <linearGradient id="ink-wash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#050505" stop-opacity="0.98" />
                    <stop offset="40%" stop-color="#141414" stop-opacity="0.95" />
                    <stop offset="75%" stop-color="#222222" stop-opacity="0.90" />
                    <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.97" />
                </linearGradient>
                
                <!-- Ink Bleed & Calligraphy Stroke Filter -->
                <filter id="ink-bleed" x="-15%" y="-15%" width="130%" height="130%">
                    <!-- Generate high-fidelity turbulence for paper texture absorption -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" result="noise" />
                    <!-- Displace the edges of vector elements to simulate organic brush hairs and bleed -->
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                    <!-- Apply a very subtle blur to simulate water bleeding into rice paper fibers -->
                    <feGaussianBlur in="displaced" stdDeviation="0.45" result="bleed" />
                    <!-- Combine with a faint copy of the source for perfect core visibility -->
                    <feMerge>
                        <feMergeNode in="bleed" />
                        <feMergeNode in="SourceGraphic" opacity="0.15" />
                    </feMerge>
                </filter>
            </defs>

            <!-- Wrap all elements in a group with the ink-bleed filter for a calligraphic style -->
            <g filter="url(#ink-bleed)">
                <!-- Outer Bagua Trigrams (Tiên Thiên Bát Quái) in soft calligraphic ivory/white -->
                <!-- 1. Càn (0° - Top): 3 Solid -->
                <g transform="rotate(0, 50, 50)">
                    <rect x="43" y="15" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="43" y="11" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="43" y="7" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 2. Tốn (45°): Inner Broken, Middle Solid, Outer Solid -->
                <g transform="rotate(45, 50, 50)">
                    <!-- Inner Broken -->
                    <rect x="43" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Solid -->
                    <rect x="43" y="11" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Solid -->
                    <rect x="43" y="7" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 3. Khảm (90°): Inner Broken, Middle Solid, Outer Broken -->
                <g transform="rotate(90, 50, 50)">
                    <!-- Inner Broken -->
                    <rect x="43" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Solid -->
                    <rect x="43" y="11" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Broken -->
                    <rect x="43" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 4. Cấn (135°): Inner Broken, Middle Broken, Outer Solid -->
                <g transform="rotate(135, 50, 50)">
                    <!-- Inner Broken -->
                    <rect x="43" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Broken -->
                    <rect x="43" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Solid -->
                    <rect x="43" y="7" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 5. Khôn (180°): 3 Broken -->
                <g transform="rotate(180, 50, 50)">
                    <!-- Inner Broken -->
                    <rect x="43" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="15" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Broken -->
                    <rect x="43" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Broken -->
                    <rect x="43" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 6. Chấn (225°): Inner Solid, Middle Broken, Outer Broken -->
                <g transform="rotate(225, 50, 50)">
                    <!-- Inner Solid -->
                    <rect x="43" y="15" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Broken -->
                    <rect x="43" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Broken -->
                    <rect x="43" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 7. Ly (270°): Inner Solid, Middle Broken, Outer Solid -->
                <g transform="rotate(270, 50, 50)">
                    <!-- Inner Solid -->
                    <rect x="43" y="15" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Broken -->
                    <rect x="43" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="11" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Solid -->
                    <rect x="43" y="7" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>
                <!-- 8. Đoài (315°): Inner Solid, Middle Solid, Outer Broken -->
                <g transform="rotate(315, 50, 50)">
                    <!-- Inner Solid -->
                    <rect x="43" y="15" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Middle Solid -->
                    <rect x="43" y="11" width="14" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <!-- Outer Broken -->
                    <rect x="43" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                    <rect x="51.25" y="7" width="5.75" height="1.2" rx="0.4" fill="#f6f5f0" />
                </g>

                <!-- Inner Yin-Yang (Tai Chi) -->
                <!-- Base Yang half: soft antique rice paper white -->
                <circle cx="50" cy="50" r="28" fill="#fcfaf2" />
                <!-- Yin half: calligraphic ink wash gradient -->
                <path d="M 50,22 A 28,28 0 0,0 50,78 A 14,14 0 0,0 50,50 A 14,14 0 0,1 50,22 Z" fill="url(#ink-wash-grad)" />
                <!-- Small circles (eyes): organic ink droplets -->
                <!-- Black eye inside upper White bulge -->
                <circle cx="50" cy="36" r="3.2" fill="#080808" />
                <!-- White eye inside lower Black bulge -->
                <circle cx="50" cy="64" r="3.2" fill="#fcfaf2" />
            </g>
        </svg>
    </div>

    <!-- Title -->
    <h1 class="loading-title">PHÀM NHÂN VẤN ĐẠO</h1>

    <!-- Progress Section -->
    <div class="loading-progress-container">
        <div class="loading-status-wrap">
            <span id="loading-text" class="loading-text">
                Đang thu nạp linh khí...
            </span>
            <span id="loading-percent" class="loading-percent">0%</span>
        </div>
        
        <div class="qi-conduit-outer">
            <div id="loading-bar" class="qi-conduit-inner" style="width: 0%"></div>
        </div>
    </div>

    <!-- Footer Tip -->
    <p class="loading-footer-tip">
        「 Đường tu tiên vạn dặm, tâm bất động, đạo bất di. 」
    </p>

    <script>
        // Generate ethereal particles for the loading screen
        const particleContainer = document.getElementById('spirit-particles');
        if (particleContainer) {
            const particleCount = 12; // Reduced for premium, elegant atmosphere
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'spirit-particle';
                
                // Randomize position and animation properties
                const size = Math.random() * 2 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 8 + 8; // Much slower (8s - 16s)
                const delay = Math.random() * 10;
                p.style.animationDuration = duration + 's';
                p.style.animationDelay = delay + 's';
                
                // Subtle glow variation
                const blur = Math.random() * 1.5 + 1;
                p.style.filter = `blur(${blur}px)`;
                p.style.opacity = Math.random() * 0.3 + 0.15;
                
                particleContainer.appendChild(p);
            }
        }
    </script>
</div>
