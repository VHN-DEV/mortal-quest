<!-- Loot Screen (PUBG Style) -->
<div id="loot-screen-overlay" class="hidden overlay-full animate-fade-in bg-[#0a0a0c]/98 z-[1200] flex flex-col p-4 md:p-8">
    <!-- Decorative Corners -->
    <div class="absolute top-4 left-4 w-12 h-12 border-t-2 border-l-2 border-cultivation-gold/20 pointer-events-none"></div>
    <div class="absolute top-4 right-4 w-12 h-12 border-t-2 border-r-2 border-cultivation-gold/20 pointer-events-none"></div>
    <div class="absolute bottom-4 left-4 w-12 h-12 border-b-2 border-l-2 border-cultivation-gold/20 pointer-events-none"></div>
    <div class="absolute bottom-4 right-4 w-12 h-12 border-b-2 border-r-2 border-cultivation-gold/20 pointer-events-none"></div>

    <div class="flex-grow flex flex-col max-w-5xl mx-auto w-full space-y-4 md:space-y-6 overflow-hidden relative z-10">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center px-4 gap-4 shrink-0">
            <div class="flex items-center space-x-4">
                <div class="relative w-12 h-12 md:w-14 md:h-14 shrink-0">
                    <div class="absolute inset-0 bg-cultivation-gold/20 rounded-2xl blur-lg animate-pulse"></div>
                    <div class="relative w-full h-full bg-gradient-to-br from-cultivation-gold/20 to-black/40 rounded-2xl flex items-center justify-center border border-cultivation-gold/40 shadow-[0_0_20px_rgba(212,175,55,0.2)]">
                        <i class="ph ph-treasure-chest text-2xl md:text-3xl text-cultivation-gold"></i>
                    </div>
                </div>
                <div class="min-w-0">
                    <h2 id="loot-target-name" class="text-xl md:text-2xl font-charm text-white tracking-widest leading-tight truncate">Thi Thể Đối Thủ</h2>
                    <p class="text-[9px] text-cultivation-gold/60 uppercase tracking-[0.3em] mt-1">Lục soát chiến lợi phẩm</p>
                </div>
            </div>
            <button id="btn-loot-take-all" class="px-6 py-2.5 rounded-2xl text-[10px] md:text-[11px] uppercase tracking-[0.15em] transition-all shrink-0">
                Lấy Tất Cả
            </button>
        </div>

        <!-- Victim Inventory (Top) -->
        <div class="flex-1 flex flex-col min-h-0 bg-black/60 rounded-[2.5rem] border border-white/5 overflow-hidden shadow-2xl">
            <div class="flex items-center space-x-3 p-4 bg-white/[0.03] border-b border-white/5">
                <div class="w-2 h-2 rounded-full bg-red-500/50 animate-pulse"></div>
                <span class="text-[9px] text-gray-400 uppercase font-bold tracking-[0.3em]">Chiến Lợi Phẩm</span>
                <div class="h-px flex-1 bg-gradient-to-r from-white/10 to-transparent"></div>
            </div>
            <div id="victim-loot-list" class="flex-1 overflow-y-auto grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3 p-6 custom-scroll">
                <!-- Victim items here -->
            </div>
        </div>

        <!-- Player Inventory (Bottom) -->
        <div class="flex-1 flex flex-col min-h-0 bg-black/60 rounded-[2.5rem] border border-white/5 overflow-hidden shadow-2xl">
            <div class="flex items-center space-x-3 p-4 bg-white/[0.03] border-b border-white/5">
                <div class="w-2 h-2 rounded-full bg-qi-blue/50 animate-pulse"></div>
                <span class="text-[9px] text-qi-blue uppercase font-bold tracking-[0.3em]">Túi Của Ngươi</span>
                <div class="h-px flex-1 bg-gradient-to-r from-qi-blue/20 to-transparent"></div>
            </div>
            <div id="player-loot-list" class="flex-1 overflow-y-auto grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3 p-6 custom-scroll">
                <!-- Player items here -->
            </div>
        </div>

        <div class="flex justify-center pt-2 shrink-0">
            <button id="btn-loot-confirm" class="w-full max-w-sm py-4 rounded-2xl text-xs font-bold transition-all">
                HOÀN TẤT KIỂM KÊ
            </button>
        </div>
    </div>
</div>
