<!-- Mountain Overlay -->
<div id="mountain-overlay" class="hidden overlay-full bg-[#0a0a0c] z-[120] animate-fade-in">
    <header
        class="flex-none p-6 flex justify-between items-center border-b border-red-900/20 bg-red-950/10 backdrop-blur-md">
        <div class="flex items-center space-x-4">
            <div
                class="w-10 h-10 rounded-full bg-red-900/20 border border-red-500/30 flex items-center justify-center text-red-500">
                <i class="ph ph-mountain text-xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-charm text-red-500 leading-tight">Thập Vạn Đại Sơn</h2>
                <p class="text-[8px] text-red-900/60 uppercase tracking-[0.2em]">Cấm Địa Thượng Cổ</p>
            </div>
        </div>
        <button id="close-mountain-btn"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-gray-500 hover:text-white transition-all">
            <i class="ph ph-x text-xl"></i>
        </button>
    </header>

    <div class="flex-grow min-h-0 overflow-y-auto p-6 custom-scroll">
        <div class="space-y-8 pb-24">
            <!-- Layer Info -->
            <div
                class="relative p-6 rounded-[2rem] border border-red-900/30 bg-gradient-to-br from-red-950/20 to-black overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="ph ph-skull text-6xl text-red-500"></i>
                </div>
                <div class="relative z-10 text-center space-y-4">
                    <div>
                        <h3 id="mountain-layer-name" class="text-2xl font-ancient text-red-400 mb-1">Ngoại Vi
                            Đại Sơn</h3>
                        <p id="mountain-layer-desc" class="text-[10px] text-gray-500 italic font-serif">"Vùng
                            ngoài cùng, linh khí loãng và đầy sương mù..."</p>
                    </div>

                    <!-- Layer Progress -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-end px-1">
                            <span class="text-[7px] text-red-900/60 uppercase tracking-widest font-bold">Tiến Độ
                                Tầng</span>
                            <span id="mountain-layer-progress-text"
                                class="text-[9px] font-mono text-red-400">0%</span>
                        </div>
                        <div
                            class="h-1 w-full bg-red-950/40 rounded-full overflow-hidden border border-red-900/10">
                            <div id="mountain-layer-progress-bar"
                                class="h-full bg-red-600 shadow-[0_0_8px_rgba(220,38,38,0.4)] transition-all duration-1000"
                                style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Survival Stats -->
            <div class="mountain-survival-panel grid grid-cols-1 gap-6">
                <div class="space-y-3">
                    <div class="flex justify-between items-end px-1">
                        <div class="flex items-center space-x-2">
                            <i class="ph ph-wind text-qi-blue text-xs"></i>
                            <span class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">Dưỡng
                                Khí</span>
                        </div>
                        <span id="mountain-oxygen-text" class="text-xs font-mono text-qi-blue">100%</span>
                    </div>
                    <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden border border-white/5 p-0.5">
                        <div id="mountain-oxygen-bar"
                            class="h-full bg-gradient-to-r from-qi-blue to-blue-400 rounded-full transition-all duration-500 shadow-[0_0_15px_rgba(79,209,197,0.3)]"
                            style="width: 100%"></div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-end px-1">
                        <div class="flex items-center space-x-2">
                            <i class="ph ph-skull text-red-500 text-xs"></i>
                            <span class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">Chướng
                                Khí</span>
                        </div>
                        <span id="mountain-toxicity-text" class="text-xs font-mono text-red-500">0%</span>
                    </div>
                    <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden border border-white/5 p-0.5">
                        <div id="mountain-toxicity-bar"
                            class="h-full bg-gradient-to-r from-red-600 to-red-400 rounded-full transition-all duration-500 shadow-[0_0_15px_rgba(239,68,68,0.3)]"
                            style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Event Log -->
            <div class="space-y-3">
                <div class="flex items-center space-x-2 px-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
                    <span class="text-[8px] text-gray-500 uppercase tracking-widest font-bold">Nhật Ký Thám
                        Hiểm</span>
                </div>
                <div id="mountain-event-log"
                    class="mountain-log min-h-[200px] max-h-[300px] overflow-y-auto custom-scroll">
                    <p>Đã bước vào chân núi...</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-4">
                <button id="btn-mountain-explore"
                    class="w-full py-3 bg-gradient-to-r from-red-600/30 to-red-900/30 border border-red-500/40 rounded-2xl active:scale-95 transition-all flex items-center justify-center space-x-3 shadow-[0_0_30px_rgba(220,38,38,0.2)] group pointer-events-auto">
                    <i class="ph ph-footprints text-red-500 text-2xl group-hover:animate-bounce"></i>
                    <span class="text-sm font-bold text-white uppercase tracking-[0.5em]">TIẾP TỤC KHÁM
                        PHÁ</span>
                </button>

                <div class="grid grid-cols-2 gap-4">
                    <button id="btn-mountain-deeper"
                        class="group relative py-4 bg-red-900/40 border border-red-500/30 rounded-2xl overflow-hidden active:scale-95 transition-all shadow-2xl pointer-events-auto">
                        <div
                            class="absolute inset-0 bg-red-500/10 opacity-0 group-hover:opacity-100 transition-opacity">
                        </div>
                        <span
                            class="relative z-10 text-xs font-bold text-red-400 uppercase tracking-[0.2em]">TẦNG
                            KẾ TIẾP</span>
                    </button>
                    <button id="btn-mountain-retreat"
                        class="py-4 bg-white/5 border border-white/10 rounded-2xl active:scale-95 transition-all text-xs font-bold text-gray-500 uppercase tracking-[0.2em] pointer-events-auto">RÚT
                        LUI</button>
                </div>
            </div>
        </div>
    </div>
</div>
