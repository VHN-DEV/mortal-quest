<!-- Mission Screen -->
<div id="mission-screen"
    class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] hidden flex-col p-6 animate-fade-in">
    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 bg-qi-blue/20 rounded-full flex items-center justify-center border border-qi-blue/40">
                <i class="ph-bold ph-scroll text-qi-blue text-xl"></i>
            </div>
            <div>
                <h2 class="text-2xl font-ancient text-white tracking-wider">TÔNG MÔN NHIỆM VỤ</h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest">Sect Mission Board</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="btn-refresh-mission"
                class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10 transition-all">
                <i class="ph ph-arrows-clockwise text-gray-400"></i>
            </button>
            <button id="btn-close-mission"
                class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-red-500/20 hover:border-red-500/40 transition-all">
                <i class="ph ph-x text-gray-400 hover:text-red-500"></i>
            </button>
        </div>
    </div>

    <div id="mission-list" class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
        <!-- Missions will be injected here -->
    </div>

    <div class="mt-6 pt-4 border-t border-white/5 flex justify-between items-center text-[10px] text-gray-500">
        <span>Nhiệm vụ làm mới sau mỗi 5 phút</span>
        <span class="italic">"Công đức vô lượng, thăng tiến tông môn"</span>
    </div>
</div>
