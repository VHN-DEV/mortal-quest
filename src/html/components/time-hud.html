<!-- Time HUD -->
<div id="time-hud"
    class="px-4 py-2 bg-black/40 border-b border-white/5 flex items-center justify-between text-[10px] font-ancient">
    <div class="flex items-center space-x-3">
        <div id="time-clock-icon" class="text-qi-blue"><i class="ph ph-clock animate-pulse"></i></div>
        <div>
            <span id="time-hour" class="text-white font-bold uppercase tracking-widest">Giờ Tý</span>
            <span id="time-period" class="text-gray-500 ml-1">(Ban Đêm)</span>
        </div>
    </div>
    <div class="flex items-center space-x-4">
        <div id="time-phenomenon" class="hidden text-red-400 animate-pulse font-bold">Huyết Nguyệt</div>
        <div class="flex items-center space-x-2">
            <span id="time-season" class="px-2 py-0.5 rounded border border-qi-jade/30 text-qi-jade">Mùa
                Xuân</span>
            <span id="time-date" class="text-gray-400">Ngày 1 Tháng 1 Năm 1</span>
        </div>
    </div>
</div>
