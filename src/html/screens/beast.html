<!-- Tab: Linh Thú & Kỳ Trùng (Beast - NEW) -->
<div id="screen-beast" class="screen hidden flex flex-col h-full p-6 overflow-y-auto custom-scroll">
    <div class="flex justify-between items-start mb-8">
        <div class="flex items-center space-x-4">
            <button onclick="game.screens.systems.openCraftingHub()"
                class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/10 hover:bg-white/10 transition-all active:scale-90">
                <i class="ph ph-caret-left text-xl text-qi-jade"></i>
            </button>
            <div>
                <h2 class="text-3xl font-charm text-cultivation-gold">Vạn Thú Viên</h2>
                <p class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mt-1">Ngự Thú Phục Trùng</p>
            </div>
        </div>
        <div class="text-right">
            <div id="beast-level-text"
                class="text-[9px] font-ancient text-qi-jade uppercase tracking-widest">Ngự Thú
                Sư</div>
            <div class="w-24 h-1 bg-white/5 rounded-full mt-1.5 overflow-hidden border border-white/5">
                <div id="beast-exp-bar"
                    class="h-full bg-gradient-to-r from-qi-jade to-cultivation-gold shadow-[0_0_5px_rgba(212,175,55,0.5)]"
                    style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="flex space-x-2 mb-6 bg-black/40 p-1 rounded-2xl border border-white/5">
        <button id="beast-tab-beast"
            class="flex-grow py-2 bg-qi-jade/10 text-qi-jade border border-qi-jade/20 rounded-xl text-[10px] font-ancient uppercase tracking-widest transition-all">Ngự
            Thú</button>
        <button id="beast-tab-insect"
            class="flex-grow py-2 text-gray-500 rounded-xl text-[10px] font-ancient uppercase tracking-widest transition-all">Ngự
            Trùng</button>
        <button id="beast-tab-hatch"
            class="flex-grow py-2 text-gray-500 rounded-xl text-[10px] font-ancient uppercase tracking-widest transition-all">Ấp
            Trứng</button>
    </div>

    <div id="beast-list-view" class="flex-grow overflow-y-auto space-y-4 custom-scroll pb-10">
    </div>
    <div id="beast-hatch-view" class="hidden flex-grow overflow-y-auto space-y-4 custom-scroll pb-10"></div>
</div>
