<!-- Tab: Khôi Lỗi (Puppet - NEW) -->
<div id="screen-puppet" class="screen hidden flex flex-col h-full p-6 overflow-y-auto custom-scroll">
    <div class="flex justify-between items-start mb-8">
        <div class="flex items-center space-x-4">
            <button onclick="game.screens.systems.openCraftingHub()"
                class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/10 hover:bg-white/10 transition-all active:scale-90">
                <i class="ph ph-caret-left text-xl text-qi-blue"></i>
            </button>
            <div>
                <h2 class="text-3xl font-ancient text-qi-blue">Khôi Lỗi Đường</h2>
                <p class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mt-1">Cơ Quan Diệu Pháp</p>
            </div>
        </div>
        <div class="text-right">
            <div id="puppet-level-text"
                class="text-[9px] font-ancient text-cultivation-gold uppercase tracking-widest">
                Khôi Lỗi Sư</div>
            <div class="w-24 h-1 bg-white/5 rounded-full mt-1.5 overflow-hidden border border-white/5">
                <div id="puppet-exp-bar"
                    class="h-full bg-gradient-to-r from-qi-blue to-qi-purple shadow-[0_0_5px_rgba(79,209,197,0.5)]"
                    style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="flex space-x-2 mb-6 bg-black/40 p-1 rounded-2xl border border-white/5">
        <button id="puppet-tab-craft"
            class="flex-grow py-2 bg-qi-blue/10 text-qi-blue border border-qi-blue/20 rounded-xl text-[10px] font-ancient uppercase tracking-widest transition-all">
            Luyện Chế
        </button>
        <button id="puppet-tab-owned"
            class="flex-grow py-2 text-gray-500 rounded-xl text-[10px] font-ancient uppercase tracking-widest transition-all">
            Khôi Lỗi Sở Hữu
        </button>
    </div>

    <div id="puppet-recipes-view" class="flex-grow overflow-y-auto space-y-4 custom-scroll pb-10">
        <!-- Puppet recipes will be here -->
    </div>
    <div id="puppet-owned-view" class="hidden flex-grow overflow-y-auto space-y-4 custom-scroll pb-10">
        <!-- Owned puppets will be here -->
    </div>
</div>
