<!-- Tab: Luyện Thi (Corpse) -->
<div id="screen-corpse" class="screen hidden flex flex-col h-full overflow-hidden">
    <!-- Header -->
    <div class="flex justify-between items-start p-6 pb-3 flex-shrink-0">
        <div class="flex items-center space-x-4">
            <button onclick="game.screens.systems.openCraftingHub()"
                class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/10 hover:bg-white/10 transition-all active:scale-90">
                <i class="ph ph-caret-left text-xl text-red-700"></i>
            </button>
            <div>
                <h2 class="text-3xl font-charm text-red-700">Thi Luyện Điện</h2>
                <p class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mt-1">Khống Thi Ngự Quỷ · Luyện Thi Sư</p>
            </div>
        </div>
        <div class="text-right">
            <div id="corpse-level-text" class="text-[9px] font-ancient text-gray-400 uppercase tracking-widest">Luyện Thi Sư</div>
            <div class="w-24 h-1 bg-white/5 rounded-full mt-1.5 overflow-hidden border border-white/5">
                <div id="corpse-exp-bar"
                    class="h-full bg-gradient-to-r from-gray-800 to-red-900 shadow-[0_0_5px_rgba(153,27,27,0.5)] transition-all duration-700"
                    style="width: 0%"></div>
            </div>
            <div id="corpse-max-text" class="text-[8px] text-gray-600 mt-0.5">Khống chế: 0/0</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex space-x-1 px-6 mb-3 flex-shrink-0">
        <button id="corpse-tab-owned"
            class="px-4 py-1.5 text-[10px] font-bold rounded-lg border transition-all uppercase tracking-wider"
            onclick="window.game.screens.systems.setCorpseTab('owned')">
            <i class="ph ph-skull mr-1"></i>Thi Khôi
        </button>
        <button id="corpse-tab-craft"
            class="px-4 py-1.5 text-[10px] font-bold rounded-lg border transition-all uppercase tracking-wider"
            onclick="window.game.screens.systems.setCorpseTab('craft')">
            <i class="ph ph-flask mr-1"></i>Luyện Chế
        </button>
    </div>

    <!-- Content Area -->
    <div class="flex-grow overflow-y-auto custom-scroll px-6 pb-10">
        <!-- Owned / Management View -->
        <div id="corpse-owned-view">
            <!-- dynamically filled -->
        </div>

        <!-- Craft / Recipes View -->
        <div id="corpse-craft-view" class="hidden">
            <!-- dynamically filled -->
        </div>
    </div>
</div>
