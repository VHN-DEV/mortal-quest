<!-- Global Header -->
<header
    class="p-4 bg-gradient-to-b from-black to-transparent border-b border-white/5 flex items-center justify-between z-50">
    <div class="flex items-center space-x-3">
        <div id="header-portrait-container"
            class="w-10 h-10 rounded-full border border-cultivation-gold p-0.5 relative cursor-pointer active:scale-90 transition-all hover:shadow-[0_0_15px_rgba(212,175,55,0.4)]">
            <img id="header-portrait" src="./src/assets/images/players/player_male.webp"
                class="w-full h-full object-cover rounded-full">
        </div>
        <div>
            <h1 id="player-name-header" class="text-sm font-charm text-white">Phàm Nhân</h1>
            <div class="flex items-center space-x-2">
                <span id="current-realm"
                    class="text-[9px] text-cultivation-gold uppercase tracking-widest font-ancient">Phàm
                    Nhân</span>
            </div>
        </div>
    </div>
    <div class="flex items-center space-x-2">
        <button onclick="state.ui.showGuide()"
            class="w-8 h-8 flex items-center justify-center bg-black/40 border border-cultivation-gold/30 rounded-full text-cultivation-gold hover:text-white hover:bg-cultivation-gold/20 transition-all active:scale-90"
            title="Sổ Tay Tu Tiên">
            <i class="ph ph-book-open text-lg"></i>
        </button>
        <button id="btn-toggle-mute"
            class="w-8 h-8 flex items-center justify-center bg-black/40 border border-white/5 rounded-full text-gray-500 hover:text-white transition-all active:scale-90">
            <i id="mute-icon" class="ph ph-speaker-high"></i>
        </button>
        <div id="header-lingshi-container"
             class="flex items-center space-x-1.5 bg-black/40 px-3 py-1 rounded-full border border-white/5 cursor-pointer hover:border-cultivation-gold/50 transition-all active:scale-95">
            <i class="ph ph-gemstone text-cultivation-gold text-xs"></i>
            <span id="ling-shi-text" class="text-xs font-mono text-white">100</span>
        </div>
    </div>
</header>
