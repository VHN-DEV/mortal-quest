<!-- Myriad Weapons Pavilion (Vạn Khí Lâu) Overlay -->
<div id="van-khi-lau-overlay" class="hidden overlay-full animate-fade-in bg-[#03060a] z-[150] overflow-hidden">
    <!-- Background Glow Effects -->
    <div class="absolute inset-0 opacity-15 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-qi-blue rounded-full blur-[140px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-cultivation-gold rounded-full blur-[140px]"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full">
        <!-- Header -->
        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-black/40">
            <div>
                <h2 class="text-xl font-ancient text-cultivation-gold uppercase tracking-widest">Vạn Khí Lâu</h2>
                <div class="flex items-center space-x-2 mt-1">
                    <i class="ph ph-shield-chevron text-xs text-gray-500"></i>
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Thiên Nam Danh Lâu</span>
                </div>
            </div>
            <button onclick="state.ui.toggleOverlay(document.getElementById('van-khi-lau-overlay'), false)"
                class="p-2 hover:bg-white/5 rounded-full transition-colors">
                <i class="ph ph-x text-xl text-gray-500"></i>
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex p-3 space-x-1.5 bg-black/60 border-b border-white/5">
            <button id="van-khi-lau-tab-shop" onclick="window.game.setVanKhiLauTab('shop')"
                class="flex-1 py-2.5 bg-cultivation-gold/10 text-cultivation-gold border border-cultivation-gold/20 rounded-xl text-[9px] font-ancient uppercase tracking-wider font-bold transition-all">
                Tiệm Rèn
            </button>
            <button id="van-khi-lau-tab-forge" onclick="window.game.setVanKhiLauTab('forge')"
                class="flex-1 py-2.5 text-gray-500 rounded-xl text-[9px] font-ancient uppercase tracking-wider font-bold transition-all">
                Đặt Luyện
            </button>
            <button id="van-khi-lau-tab-repair" onclick="window.game.setVanKhiLauTab('repair')"
                class="flex-1 py-2.5 text-gray-500 rounded-xl text-[9px] font-ancient uppercase tracking-wider font-bold transition-all">
                Bảo Dưỡng
            </button>
            <button id="van-khi-lau-tab-upgrade" onclick="window.game.setVanKhiLauTab('upgrade')"
                class="flex-1 py-2.5 text-gray-500 rounded-xl text-[9px] font-ancient uppercase tracking-wider font-bold transition-all">
                Nâng Cấp
            </button>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-grow overflow-y-auto p-4 space-y-4 custom-scroll" id="van-khi-lau-content">
            <!-- View: Shop -->
            <div id="van-khi-lau-shop-view" class="space-y-4">
                <div class="p-6 border border-white/5 rounded-3xl bg-white/5 text-center space-y-4 mt-6">
                    <span class="text-4xl block">🏪</span>
                    <h3 class="text-sm font-ancient text-cultivation-gold font-bold">Thương Hội Vạn Khí Lâu</h3>
                    <p class="text-[10px] text-gray-400 leading-relaxed max-w-xs mx-auto">
                        Chuyên cung cấp các loại pháp khí cơ bản, pháp bảo cao cấp cùng vô số linh quặng rèn đúc thô sơ.
                    </p>
                    <button onclick="window.game.openShop('buy', 'van_khi_lau')" 
                        class="px-6 py-2.5 btn-gold text-[10px] font-bold rounded-xl uppercase tracking-wider">
                        Mở Giao Dịch
                    </button>
                </div>
            </div>

            <!-- View: Forge (Đặt luyện cổ phương) -->
            <div id="van-khi-lau-forge-view" class="hidden space-y-3">
                <!-- Recipes list will be rendered here dynamically -->
            </div>

            <!-- View: Repair (Bảo dưỡng pháp bảo) -->
            <div id="van-khi-lau-repair-view" class="hidden space-y-3">
                <!-- Equipped items durability & repair options rendered here -->
            </div>

            <!-- View: Upgrade (Nâng cấp pháp bảo) -->
            <div id="van-khi-lau-upgrade-view" class="hidden space-y-3">
                <!-- Equipped items upgrade options rendered here -->
            </div>
        </div>

        <!-- Footer Player Stats Info -->
        <div class="p-4 border-t border-white/5 bg-black/60 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-[7px] text-gray-500 uppercase tracking-widest">Linh Thạch Hiện Có</span>
                <span id="van-khi-lau-lingshi-text" class="text-[11px] text-cultivation-gold font-mono font-bold">0</span>
            </div>
            <div class="text-right">
                <span class="text-[7px] text-gray-500 uppercase tracking-widest">Hỏa Hầu Trận Pháp</span>
                <div class="text-[11px] text-amber-500 font-mono font-bold">Đỉnh Cấp</div>
            </div>
        </div>
    </div>
</div>
