<div id="chung-toc-luc-overlay"
    class="hidden overlay-full z-[450] bg-black/96 flex items-center justify-center p-4 instant-overlay">
    <div
        class="w-full max-w-md h-[90vh] bg-[#020617] border border-qi-jade/30 rounded-[2.5rem] flex flex-col shadow-[0_0_100px_rgba(16,185,129,0.15)] overflow-hidden relative">

        <!-- Header -->
        <div
            class="relative z-10 p-6 border-b border-white/5 flex justify-between items-center bg-gradient-to-b from-emerald-950/20 to-transparent">
            <div>
                <h2
                    class="text-3xl font-charm text-qi-jade uppercase tracking-widest drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]">
                    Vạn Tộc Thông Giám</h2>
                <p class="text-[9px] text-gray-500 uppercase tracking-[0.4em] mt-1">Thiên Địa Vạn Tộc Quyển</p>
            </div>
            <button id="close-chung-toc-luc-btn"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-gray-500 hover:text-white transition-all active:scale-90">
                <i class="ph ph-x text-2xl"></i>
            </button>
        </div>

        <!-- List View -->
        <div id="chung-toc-list-view" class="relative z-10 flex-grow overflow-y-auto p-4 space-y-3 custom-scroll">
            <!-- Dynamic list items -->
        </div>

        <!-- Detail View (Initially Hidden) -->
        <div id="chung-toc-detail-view"
            class="hidden relative z-10 flex-grow flex flex-col overflow-y-auto custom-scroll p-6 animate-fade-in">
            <button id="back-to-chung-toc-list-btn"
                class="absolute top-4 left-4 text-gray-500 hover:text-white flex items-center space-x-2 text-[10px] uppercase tracking-widest transition-all">
                <i class="ph ph-arrow-left"></i>
                <span>Quay lại</span>
            </button>

            <div class="mt-8 flex flex-col items-center text-center space-y-6">
                <div id="chung-toc-detail-icon-wrap"
                    class="w-32 h-32 rounded-full border-2 border-qi-jade/30 flex items-center justify-center bg-black/60 shadow-[0_0_30px_rgba(16,185,129,0.2)] relative">
                    <div class="absolute inset-0 rounded-full animate-pulse bg-qi-jade/5"></div>
                    <span id="chung-toc-detail-icon"
                        class="text-6xl filter drop-shadow-[0_0_15px_rgba(16,185,129,0.6)]">👤</span>
                </div>

                <div class="space-y-1">
                    <h3 id="chung-toc-detail-name" class="text-3xl font-ancient text-white tracking-widest">Tên
                        Chủng Tộc</h3>
                    <div class="text-[11px] text-cultivation-gold italic tracking-widest">"Huyết mạch truyền
                        thừa"</div>
                </div>

                <div class="w-full space-y-4 text-left">
                    <div class="bg-white/5 rounded-2xl p-5 border border-white/10">
                        <h4
                            class="text-[9px] text-gray-500 uppercase tracking-widest mb-3 border-b border-white/5 pb-2">
                            Mô tả chủng tộc</h4>
                        <p id="chung-toc-detail-desc" class="text-xs text-gray-300 leading-relaxed"></p>
                    </div>
                    <div class="bg-emerald-950/20 rounded-2xl p-5 border border-emerald-900/20">
                        <h4
                            class="text-[9px] text-qi-jade uppercase tracking-widest mb-3 border-b border-emerald-900/10 pb-2">
                            Đặc điểm thiên bẩm</h4>
                        <div id="chung-toc-detail-stats" class="space-y-1">
                            <!-- Dynamic stats -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="relative z-10 p-6 border-t border-white/5 bg-black/40 text-center">
            <p class="text-[8px] text-gray-600 italic">"Vạn tộc tranh phong, ai là chính thống?"</p>
        </div>
    </div>
</div>
