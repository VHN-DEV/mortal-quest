<!-- Awakening Destiny Overlay -->
<div id="destiny-overlay" class="hidden overlay-full z-[500] p-6 custom-scroll">
    <h2 class="text-4xl font-ancient text-cultivation-gold text-center mb-8 animate-pulse">Thức Tỉnh Thiên Mệnh
    </h2>
    <div class="flex-grow space-y-6 max-w-sm mx-auto w-full">
        <div class="bg-white/5 border border-white/10 rounded-2xl p-5 relative overflow-hidden group">
            <div id="destiny-root-bg" class="absolute inset-0 opacity-10 transition-all duration-1000"></div>
            <h3 class="text-xs font-ancient text-gray-400 uppercase tracking-widest mb-3">Linh Căn</h3>
            <div id="destiny-root-name" class="text-2xl font-bold text-white mb-1">---</div>
            <div id="destiny-root-quality" class="text-xs font-bold uppercase tracking-tighter">---</div>
            <p class="text-[10px] text-gray-500 mt-2">Quyết định tốc độ tu luyện và khả năng tương thích công
                pháp.
            </p>
        </div>
        <div class="bg-white/5 border border-white/10 rounded-2xl p-5">
            <h3 class="text-xs font-ancient text-gray-400 uppercase tracking-widest mb-3">Thể Chất Đặc Biệt</h3>
            <div id="destiny-physique-name" class="text-xl font-bold text-qi-purple mb-1">Không có</div>
            <p id="destiny-physique-desc" class="text-[10px] text-gray-400 italic">Hầu hết phàm nhân đều không
                có
                thể chất đặc biệt.</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                <h3 class="text-[10px] font-ancient text-gray-500 uppercase mb-2">Xuất Thân</h3>
                <div id="destiny-origin-name" class="text-sm font-bold text-white">---</div>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                <h3 class="text-[10px] font-ancient text-gray-500 uppercase mb-2">Khí Vận</h3>
                <div id="destiny-luck-value" class="text-sm font-mono text-cultivation-gold">---</div>
            </div>
        </div>
        <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
            <h3 class="text-[10px] font-ancient text-gray-500 uppercase mb-2">Thiên Phú</h3>
            <div id="destiny-talents-list" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="text-center py-4">
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Thiên Đạo Đánh Giá</div>
            <div id="destiny-rating" class="text-2xl font-ancient text-white">---</div>
        </div>
    </div>
    <div class="flex space-x-4 mt-8 max-w-sm mx-auto w-full"><button id="btn-reroll-destiny"
            class="flex-grow py-3 bg-white/5 border border-white/20 rounded-xl text-white font-bold hover:bg-white/10 transition-all">TRÙNG
            SINH</button><button id="btn-confirm-destiny"
            class="flex-grow py-3 bg-cultivation-gold text-black font-ancient font-black rounded-xl shadow-lg shadow-cultivation-gold/20">BẮT
            ĐẦU</button></div>
</div>
