<!-- Modal Overlay -->
<div id="modal-overlay"
    class="absolute inset-0 bg-qi-ink/95 z-[900] hidden flex items-center justify-center p-6 instant-overlay">
    <div id="modal-content"
        class="w-full max-w-[360px] md:max-w-[400px] bg-qi-ink/95 border border-cultivation-gold/20 rounded-3xl p-6 md:p-8 shadow-[0_0_50px_rgba(0,0,0,0.6)] space-y-6">
        <div class="text-center">
            <div
                class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-cultivation-gold/5 mb-6 border border-cultivation-gold/10">
                <i id="modal-icon" class="ph ph-info text-5xl text-cultivation-gold animate-bounce-subtle"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-ancient text-white mb-3 uppercase tracking-widest">Thông
                Báo
            </h3>
            <p id="modal-message" class="text-xs text-gray-400 leading-relaxed italic font-serif px-2"></p>
            <div id="modal-input-container" class="mt-4 hidden">
                <input id="modal-input" type="text"
                    class="w-full bg-black/40 border border-white/10 rounded-xl py-2 px-4 text-white text-sm outline-none focus:border-cultivation-gold transition-colors">
            </div>
        </div>
        <div id="modal-actions" class="flex space-x-3">
            <button id="modal-btn-confirm"
                class="flex-grow py-3 bg-gradient-to-r from-cultivation-gold to-[#b8860b] text-qi-ink font-black rounded-2xl active:scale-95 transition-all shadow-lg shadow-cultivation-gold/10 uppercase tracking-[0.1em] text-xs">LĨNH
                CHỈ</button>
            <button id="modal-btn-cancel"
                class="px-6 py-3 bg-white/5 text-gray-500 text-[10px] uppercase tracking-widest hover:text-gray-400 border border-white/10 rounded-2xl transition-colors">BÃI
                BÃI</button>
        </div>
    </div>
</div>
