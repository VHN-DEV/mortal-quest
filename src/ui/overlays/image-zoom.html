<!-- Image Zoom Overlay -->
<div id="image-zoom-overlay"
    class="absolute inset-0 bg-black/90 backdrop-blur-md z-[1000] hidden flex flex-col items-center justify-center p-6 select-none opacity-0"
    onclick="ui.toggleOverlay('image-zoom-overlay', false)">
    
    <!-- Modal Container -->
    <div class="relative w-full max-w-sm flex flex-col items-center space-y-6" onclick="event.stopPropagation()">
        <!-- Close Button (Top Right) -->
        <button onclick="ui.toggleOverlay('image-zoom-overlay', false)"
            class="absolute -top-12 right-2 w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 hover:border-white/20 transition-all active:scale-95 cursor-pointer">
            <span class="text-sm">✕</span>
        </button>

        <!-- Image Container with nice glow effects -->
        <div class="relative w-full max-h-[70vh] bg-black/40 border border-white/10 rounded-3xl p-3 shadow-2xl flex items-center justify-center overflow-hidden group">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-qi-blue/10 rounded-full blur-[80px]"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-cultivation-gold/5 rounded-full blur-[80px]"></div>
            
            <img id="zoomed-image" src="" alt="Zoomed Game Artwork"
                class="max-w-full max-h-[60vh] object-contain rounded-2xl border border-white/5 shadow-inner transition-transform duration-500 ease-out select-none">
        </div>

        <!-- Action Row -->
        <div class="w-full flex justify-center px-4">
            <button id="btn-download-zoomed"
                class="w-full max-w-[200px] py-3 bg-cultivation-gold/10 hover:bg-cultivation-gold/25 text-cultivation-gold hover:text-white text-xs font-bold rounded-2xl active:scale-95 transition-all uppercase tracking-[0.15em] border border-cultivation-gold/20 flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.05)] cursor-pointer">
                <i class="ph ph-download-simple mr-2 text-base"></i> Tải ảnh về
            </button>
        </div>
    </div>
</div>
