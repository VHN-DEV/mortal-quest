<!-- Stats Modal / Bản Tòa Trạng Thái -->
<div id="stats-modal"
    class="absolute inset-0 bg-black/95 z-[300] hidden flex flex-col p-6 items-center justify-center">
    <div class="w-full max-w-xs space-y-6 animate-fade-in">
        <h2 class="text-3xl font-ancient text-cultivation-gold text-center">Bản Tòa Trạng Thái</h2>
        <div class="space-y-4">
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/10">
                <span class="text-xs text-gray-500 uppercase">Khí Huyết</span><span id="stat-hp"
                    class="text-sm font-mono text-red-400">100 / 100</span>
            </div>
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/10">
                <span class="text-xs text-gray-500 uppercase">Công Kích</span><span id="stat-atk"
                    class="text-sm font-mono text-qi-blue">10</span>
            </div>
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/10">
                <span class="text-xs text-gray-500 uppercase">Phòng Thủ</span><span id="stat-def"
                    class="text-sm font-mono text-qi-blue">5</span>
            </div>
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/10">
                <span class="text-xs text-gray-500 uppercase">Tốc Độ</span><span id="stat-spd"
                    class="text-sm font-mono text-qi-blue">10</span>
            </div>
            <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/10">
                <span class="text-xs text-gray-500 uppercase">Linh Tốc</span><span id="stat-tvps"
                    class="text-sm font-mono text-qi-purple">+1/s</span>
            </div>
        </div>
        <button id="close-stats-btn" class="w-full py-3 bg-qi-blue text-black font-bold rounded-xl mt-8">RỜI
            KHỎI</button>
    </div>
</div>
