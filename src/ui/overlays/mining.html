<!-- Mining Overlay -->
<div id="mining-overlay" class="hidden overlay-full animate-fade-in bg-[#05070a] z-[150]">
    <div class="absolute inset-0 opacity-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-qi-blue rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-qi-purple rounded-full blur-[120px]">
        </div>
    </div>

    <div class="relative z-10 flex flex-col h-full">
        <!-- Header -->
        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-black/20">
            <div>
                <h2 class="text-2xl font-ancient text-cultivation-gold uppercase tracking-widest">Khai Khoáng
                    Linh Mạch</h2>
                <div class="flex items-center space-x-2 mt-1">
                    <span id="mining-level-text" class="text-[9px] text-qi-blue font-bold">Cấp 1</span>
                    <div class="w-20 h-1 bg-white/5 rounded-full overflow-hidden">
                        <div id="mining-exp-bar" class="h-full bg-qi-blue" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <button onclick="ui.toggleOverlay('mining-overlay', false)"
                class="p-2 hover:bg-white/5 rounded-full transition-colors">
                <i class="ph ph-x text-2xl text-gray-500"></i>
            </button>
        </div>

        <!-- Tabs -->
        <div class="flex p-4 space-x-2 bg-black/40 border-b border-white/5">
            <button id="mining-tab-nodes"
                class="flex-grow py-3 bg-qi-blue/10 text-qi-blue border border-qi-blue/20 rounded-xl text-[10px] font-ancient uppercase tracking-widest">Tìm
                Linh Mạch</button>
            <button id="mining-tab-occupied"
                class="flex-grow py-3 text-gray-500 rounded-xl text-[10px] font-ancient uppercase tracking-widest">Đang
                Chiếm Lĩnh</button>
        </div>

        <!-- Content -->
        <div class="flex-grow overflow-y-auto p-4 space-y-4 custom-scroll">
            <div id="mining-nodes-view" class="space-y-4">
                <!-- Discovery view -->
            </div>
            <div id="mining-occupied-view" class="hidden space-y-4">
                <!-- Occupied nodes view -->
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="p-4 border-t border-white/5 bg-black/40 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-[8px] text-gray-500 uppercase tracking-widest">Giới hạn chiếm lĩnh</span>
                <span id="mining-slots-text" class="text-xs text-white font-mono">1 / 1</span>
            </div>
            <div class="text-right">
                <span class="text-[8px] text-gray-500 uppercase tracking-widest">Thể lực hiện tại</span>
                <div id="mining-stamina-text" class="text-xs text-qi-jade font-mono">100 / 100</div>
            </div>
        </div>
    </div>
</div>
