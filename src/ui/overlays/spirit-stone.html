<!-- Spirit Stone Management Overlay -->
<div id="spirit-stone-overlay" class="hidden absolute inset-0 z-[150] flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-black/90 backdrop-blur-md"></div>
    <div
        class="relative w-full max-w-md bg-qi-ink border border-cultivation-gold/30 rounded-[2.5rem] flex flex-col max-h-[85vh] shadow-[0_0_50px_rgba(212,175,55,0.2)] overflow-hidden">
        <!-- Header -->
        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-cultivation-gold/5">
            <h3 class="text-xl font-ancient text-cultivation-gold uppercase tracking-widest">Linh Thạch Các</h3>
            <button id="close-spirit-stone-btn" class="text-gray-500 hover:text-white transition-all">
                <i class="ph ph-x text-2xl"></i>
            </button>
        </div>

        <!-- Content -->
        <div class="flex-grow overflow-y-auto p-6 space-y-8 custom-scrollbar">
            <!-- Current Balance -->
            <div class="bg-black/40 p-4 rounded-2xl border border-white/5 text-center">
                <h4 class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">Số Dư Hiện Tại</h4>
                <div id="spirit-stone-balance"
                    class="text-lg font-mono text-white flex flex-wrap justify-center gap-2">
                    <!-- Dynamic balance display -->
                </div>
            </div>

            <!-- Refine Section -->
            <section class="space-y-4">
                <h4
                    class="text-xs font-ancient text-red-400 uppercase tracking-widest border-l-2 border-red-400 pl-3">
                    Luyện Hóa Linh Thạch</h4>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="window.game.refine('ha_pham_linh_thach')"
                        class="p-3 bg-qi-blue/10 border border-qi-blue/20 rounded-xl text-center group active:scale-95 transition-all">
                        <div class="text-[10px] text-gray-500 uppercase mb-1">Hạ Phẩm</div>
                        <div class="text-[9px] text-qi-blue font-bold">+50 Tu Vi</div>
                    </button>
                    <button onclick="window.game.refine('trung_pham_linh_thach')"
                        class="p-3 bg-qi-purple/10 border border-qi-purple/20 rounded-xl text-center group active:scale-95 transition-all">
                        <div class="text-[10px] text-gray-500 uppercase mb-1">Trung Phẩm</div>
                        <div class="text-[9px] text-qi-purple font-bold">+5k Tu Vi</div>
                    </button>
                    <button onclick="window.game.refine('thuong_pham_linh_thach')"
                        class="p-3 bg-cultivation-gold/10 border border-cultivation-gold/20 rounded-xl text-center group active:scale-95 transition-all">
                        <div class="text-[10px] text-gray-500 uppercase mb-1">Thượng Phẩm</div>
                        <div class="text-[9px] text-cultivation-gold font-bold">+500k Tu Vi</div>
                    </button>
                    <button onclick="window.game.refine('cuc_pham_linh_thach')"
                        class="p-3 bg-pink-500/10 border border-pink-500/20 rounded-xl text-center group active:scale-95 transition-all">
                        <div class="text-[10px] text-gray-500 uppercase mb-1">Cực Phẩm</div>
                        <div class="text-[9px] text-pink-400 font-bold">+50M Tu Vi</div>
                    </button>
                </div>
            </section>

            <!-- Settings Section -->
            <section class="space-y-4">
                <h4
                    class="text-xs font-ancient text-qi-purple uppercase tracking-widest border-l-2 border-qi-purple pl-3">
                    Thiết Lập Tiêu Hao</h4>
                <div class="space-y-3 bg-white/5 p-4 rounded-2xl border border-white/10">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-400">Khóa Cực Phẩm</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="ss-lock-cuc" class="sr-only peer">
                            <div
                                class="w-8 h-4 bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-400 after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-qi-purple">
                            </div>
                        </label>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-white/5">
                        <span class="text-xs text-gray-400">Tự dùng Hạ Phẩm trước</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="ss-auto-low" class="sr-only peer" checked>
                            <div
                                class="w-8 h-4 bg-white/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-400 after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-qi-blue">
                            </div>
                        </label>
                    </div>
                </div>
            </section>
        </div>

        <div class="p-6 border-t border-white/5 text-center">
            <p class="text-[9px] text-gray-500 italic">"Linh thạch là căn cơ của giới tu hành, hãy cẩn thận bảo quản."</p>
        </div>
    </div>
</div>
