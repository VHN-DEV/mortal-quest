<!-- Map Location World Select View -->
<div id="map-location-view" class="hidden overlay-full z-[60] bg-[#05070a]">
    <header
        class="flex-none p-6 flex items-center justify-between border-b border-white/5 bg-black/40 backdrop-blur-md">
        <div class="flex items-center">
            <button id="back-to-worlds"
                class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 text-qi-blue active:scale-90 transition-all border border-white/10">
                <i class="ph ph-arrow-left text-xl"></i>
            </button>
            <div class="ml-4">
                <h2 id="current-world-name" class="text-xl font-charm text-white">Sơn Hà Giới</h2>
                <p id="current-world-name-sub" class="text-[8px] text-gray-500 uppercase tracking-widest">Chọn địa điểm
                    lịch luyện</p>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <span id="player-current-loc-badge"
                class="text-[8px] text-qi-blue font-ancient border border-qi-blue/30 bg-qi-blue/10 px-2 py-0.5 rounded-md inline-block whitespace-nowrap">Đang
                ở: Chưa rõ</span>
        </div>
    </header>
    <div id="location-list" class="flex-grow min-h-0 p-6 overflow-y-auto space-y-6 custom-scroll pb-24"></div>
</div>
