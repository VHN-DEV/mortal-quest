<!-- Item Details Modal (Global - shown above all overlays) -->
<div id="item-detail" class="hidden absolute inset-0 z-[200] flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="ui.toggleOverlay('item-detail', false)">
    </div>
    <div
        class="relative w-full max-w-sm bg-[#0a0c10] border border-white/10 rounded-[2rem] p-5 shadow-2xl animate-zoom-in overflow-hidden">
        <!-- Close Button (Top Right) -->
        <button onclick="ui.toggleOverlay('item-detail', false)"
            class="absolute top-4 right-4 z-[30] w-8 h-8 rounded-full border border-white/10 bg-white/5 flex items-center justify-center text-gray-400 hover:text-white transition-all active:scale-95">
            <span class="text-xs">✕</span>
        </button>
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-qi-blue/10 rounded-full blur-[80px]"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-cultivation-gold/5 rounded-full blur-[80px]">
        </div>

        <div class="flex flex-col items-center mb-6 relative z-10">
            <div id="detail-icon-container"
                class="w-20 h-20 bg-white/5 rounded-3xl border border-white/10 flex items-center justify-center shadow-inner mb-4 relative overflow-hidden group">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
                <span id="detail-icon" class="text-4xl relative z-10 filter drop-shadow-lg">📦</span>
            </div>
            <h3 id="detail-name" class="text-xl font-bold text-white font-charm mb-1 text-center">Bảo Vật
            </h3>
            <div id="detail-type"
                class="px-3 py-0.5 bg-qi-blue/10 text-qi-blue text-[8px] font-bold uppercase tracking-widest rounded-full border border-qi-blue/20">
                Dược liệu quý
            </div>
        </div>

        <div
            class="bg-white/[0.03] p-4 rounded-3xl border border-white/5 mb-4 relative z-10 max-h-[40vh] overflow-y-auto custom-scroll">
            <p id="detail-desc" class="text-xs text-gray-400 italic leading-relaxed text-center mb-3">
            </p>
            <div id="detail-stats"
                class="space-y-1.5 border-t border-white/5 pt-3 text-[10px] font-mono text-qi-purple/90">
                <!-- Stats injected here -->
            </div>
            <!-- Related Items Section -->
            <div id="detail-connections" class="mt-3 pt-3 border-t border-white/5 hidden">
                <h4 class="text-[8px] text-gray-500 uppercase tracking-widest mb-2 flex items-center">
                    <i class="ph ph-link-simple mr-2"></i> Nhân Duyên Vật Phẩm
                </h4>
                <div id="connections-list" class="flex flex-wrap gap-1.5">
                    <!-- Connections injected here -->
                </div>
            </div>
        </div>

        <!-- Quantity Selector -->
        <div id="detail-quantity-container" class="mb-6 relative z-10 hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[9px] text-gray-500 uppercase tracking-widest">Số lượng</span>
                <span id="detail-max-quantity" class="text-[9px] text-qi-blue font-mono">Tối đa: 0</span>
            </div>
            <div class="flex items-center space-x-2">
                <button id="detail-qty-minus"
                    class="w-10 h-10 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center hover:bg-qi-blue/10 transition-all text-gray-400">-</button>
                <input id="detail-quantity-input" type="number" value="1" min="1"
                    class="flex-grow bg-black/40 border border-white/10 rounded-xl py-2 text-center text-qi-blue text-sm outline-none font-mono">
                <button id="detail-qty-plus"
                    class="w-10 h-10 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center hover:bg-qi-blue/10 transition-all text-gray-400">+</button>
                <button id="detail-qty-max"
                    class="px-3 py-2 bg-qi-blue/10 text-qi-blue text-[9px] font-bold rounded-xl border border-qi-blue/20 active:scale-95 transition-all">MAX</button>
            </div>
        </div>

        <!-- Bag Transfer (NEW) -->
        <div id="detail-transfer-container" class="mb-6 relative z-10 hidden">
            <span class="text-[9px] text-gray-500 uppercase tracking-widest mb-2 block text-center">Chuyển sang
                túi khác</span>
            <div id="detail-transfer-bags"
                class="flex flex-wrap justify-center gap-2 max-h-24 overflow-y-auto custom-scroll p-1">
                <!-- Bag buttons will be here -->
            </div>
        </div>

        <div class="flex space-x-3 relative z-10">
            <button id="btn-use-item"
                class="flex-grow py-3 bg-qi-blue/10 hover:bg-qi-blue/20 text-qi-blue text-[10px] font-bold rounded-2xl active:scale-95 transition-all uppercase tracking-[0.15em] border border-qi-blue/20">
                KÍCH HOẠT
            </button>
            <button id="btn-crush-stone"
                class="flex-grow py-3 bg-red-900/10 hover:bg-red-900/20 text-red-500 text-[10px] font-bold rounded-2xl active:scale-95 transition-all uppercase tracking-[0.15em] border border-red-900/20 hidden">
                BÓP NÁT
            </button>
            <button id="btn-equip-item"
                class="flex-grow py-3 bg-cultivation-gold/10 hover:bg-cultivation-gold/20 text-cultivation-gold text-[10px] font-bold rounded-2xl active:scale-95 transition-all uppercase tracking-[0.15em] border border-cultivation-gold/20 hidden">
                TRANG BỊ
            </button>
            <button id="btn-buy-item"
                class="flex-grow py-3 bg-qi-purple/10 hover:bg-qi-purple/20 text-qi-purple text-[10px] font-bold rounded-2xl active:scale-95 transition-all uppercase tracking-[0.15em] border border-qi-purple/20 hidden">
                TRAO ĐỔI
            </button>
            <button id="btn-sell-item"
                class="flex-grow py-3 bg-red-900/20 hover:bg-red-900/40 text-red-400 text-[10px] font-bold rounded-2xl active:scale-95 transition-all uppercase tracking-[0.15em] border border-red-500/20 hidden">
                GIAO DỊCH
            </button>
        </div>
    </div>
</div>
